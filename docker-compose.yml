name: bossqiupin

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: boss-qiupin-api:week3
    command: ["uvicorn", "app.backend:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PYTHONPATH: /app/src
      # OpenAI-compatible Agent runtime. The key is supplied by the host
      # environment and is never committed to the repository.
      AGENT_MODEL: ${AGENT_MODEL:-gpt-5.6-sol}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://hanjiu.yunyukeji.cloud/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_PROTOCOL: ${AGENT_PROTOCOL:-responses}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: boss-qiupin-frontend:week3
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      API_URL: http://api:8000
      FRONTEND_API_TIMEOUT: "180"
      FRONTEND_REAL_AGENT_TIMEOUT: "150"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
